services:
  db:
    image: postgres:16
    container_name: ecosphere-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecosphere_db}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
    volumes:
      - ecosphere-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo} -d ${POSTGRES_DB:-ecosphere_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  odoo:
    image: odoo:18.0
    container_name: ecosphere-odoo
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ODOO_PORT:-8069}:8069"
    environment:
      HOST: db
      PORT: 5432
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
      ODOO_DATABASE: ${ODOO_DATABASE:-ecosphere_db}
      ECOSPHERE_SEED_DEMO_ACCOUNTS: ${ECOSPHERE_SEED_DEMO_ACCOUNTS:-1}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
    volumes:
      - .:/mnt/extra-addons/eco_sphere_esg
      - ecosphere-odoo-data:/var/lib/odoo
    command: >-
      bash /mnt/extra-addons/eco_sphere_esg/docker-start.sh

volumes:
  ecosphere-db-data:
  ecosphere-odoo-data:
