services:
  - type: web
    name: ecosphere-odoo
    env: docker
    plan: starter
    rootDir: .
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecosphere-postgres
          property: connectionString
      - key: ODOO_DATABASE
        fromDatabase:
          name: ecosphere-postgres
          property: database
      - key: ODOO_AUTO_INIT
        value: "1"
      - key: FRONTEND_ODOO_BASE
        value: /odoo
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false

databases:
  - name: ecosphere-postgres
    plan: starter
